apiVersion: v1
kind: Pod

metadata:
  name: storage-test-pod

spec:
  containers:
    - name: nginx
      image: nginx:latest

      volumeMounts:
        - name: storage-volume
          mountPath: /usr/share/nginx/html

  volumes:
    - name: storage-volume
      persistentVolumeClaim:
        claimName: my-pvc