apiVersion: v1
kind: Pod
metadata:
  name: normal-pod
  labels:
    AppName: my-app
  namespace: test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 3001
  containers:
    - name: webserver
      image: devopscube/flask-app-non-root:1.0
      ports:
        - containerPort: 5000
      securityContext:
        runAsNonRoot: true
        runAsUser: 1002
        runAsGroup: 3002

        