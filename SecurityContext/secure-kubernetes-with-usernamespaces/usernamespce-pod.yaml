apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-userns
  namespace: test
spec:
  replicas: 3
  selector:
    matchLabels:
      AppName: nginx-userns
  template:
    metadata:
      labels:
        AppName: nginx-userns
    spec:
      hostUsers: false
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80