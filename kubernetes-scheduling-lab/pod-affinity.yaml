apiVersion: v1
kind: Pod
metadata:
  name: cache
  labels:
    app: cache
spec:
  nodeSelector:
    disktype: hdd
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: web-near-cache
  labels:
    app: web
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: cache
          topologyKey: kubernetes.io/hostname
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10