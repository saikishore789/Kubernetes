apiVersion: v1
kind: Pod
metadata:
  name: affinity-required-preferred
  labels:
    lab: node-affinity
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: disktype
                operator: In
                values:
                  - ssd
                  - hdd
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          preference:
            matchExpressions:
              - key: disktype
                operator: In
                values:
                  - hdd
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10